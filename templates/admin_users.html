<section class="page-head">
  <span class="eyebrow">Пользователи</span>
  <h1>Пользователи: $count</h1>
  <p class="muted">Сделать администратором: <code>python manage_admin.py &lt;логин&gt;</code></p>
</section>

<form method="get" action="/admin/users" class="card filter-bar">
  <label class="field filter-search"><span>Имя, почта или телефон</span>
    <input type="search" name="q" value="$search" maxlength="200" placeholder="например, 8 705 123 45 67"></label>
  <button type="submit" class="btn btn-secondary">Найти</button>
</form>

<div class="table-wrap">
  <table class="table">
    <thead><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Регистрация</th><th>Попыток</th>
      <th>Лучший ЕНТ</th><th>Последняя попытка</th><th></th></tr></thead>
    <tbody>$rows</tbody>
  </table>
</div>
