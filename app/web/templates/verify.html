<section class="auth">
  <div class="card auth-card">
    <h1>Подтвердите почту</h1>
    <p class="muted">Мы отправили 6-значный код на <strong>$email</strong>.
      Код действует $minutes минут.</p>
    $errors
    <form method="post" action="/verify" class="form" novalidate>
      <input type="hidden" name="email" value="$email">
      <label class="field">
        <span>Код из письма</span>
        <input type="text" name="code" inputmode="numeric" maxlength="12" autocomplete="one-time-code"
               placeholder="123456" required autofocus>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Подтвердить</button>
    </form>
    <form method="post" action="/verify/resend" class="auth-switch">
      <input type="hidden" name="email" value="$email">
      Письмо не пришло? <button type="submit" class="btn btn-link">Отправить код ещё раз</button>
    </form>
    <p class="auth-switch"><a class="link" href="/register">Указать другую почту</a></p>
  </div>
</section>
