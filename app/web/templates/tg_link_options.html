<form method="post" action="/tg/login" class="form" novalidate>$csrf
  <input type="hidden" name="token" value="$token">
  <label class="field">
    <span>Почта или номер телефона</span>
    <input type="text" name="login" value="$login" maxlength="254" autocomplete="username" required>
  </label>
  <label class="field">
    <span>Пароль</span>
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit" name="action" value="link" class="btn btn-secondary btn-block">Привязать и войти</button>
</form>
