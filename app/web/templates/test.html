<form method="post" action="$action" class="test-form">
  $csrf
  <input type="hidden" name="section" value="$subject">
  <button type="submit" name="goto" value="$subject" class="visually-hidden" tabindex="-1" aria-hidden="true">Сохранить</button>

  <section class="test-head">
    <div class="test-title">
      $icon
      <div>
        <span class="eyebrow">$mode_label</span>
        <h1>$heading</h1>
        <p class="muted">$progress</p>
        <progress class="answered-bar" max="$total" value="$answered"></progress>
      </div>
    </div>
    $timer
  </section>

  <nav class="tabs" aria-label="Разделы теста">$tabs</nav>

  $shortage

  <div class="questions">$questions</div>

  <div class="test-actions">$buttons</div>
  <p class="muted small center">Ответы сохраняются при любом переходе: по вкладке, «Назад», «Далее» или «Завершить».</p>
</form>
