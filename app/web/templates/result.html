<section class="page-head">
  <div class="test-title">
    $icon
    <div>
      <span class="eyebrow">$mode_label · $date</span>
      <h1>$heading</h1>
      <p class="muted">Затрачено времени: $duration</p>
    </div>
  </div>
</section>

<section class="result-summary">
  <div class="card score-card">
    <div class="ring $ring_class">
      <div class="ring-inner"><span class="ring-percent">$percent%</span></div>
    </div>
    <div>
      <p class="muted">Итоговый балл</p>
      <p class="score-big">$score <span>из $max_score</span></p>
      <p class="cheer">$cheer</p>
      $official_note
    </div>
  </div>
  <div class="card">
    <h2>Баллы по предметам</h2>
    <ul class="strength-list">$score_rows</ul>
  </div>
</section>

<section class="section">
  <div class="review-toolbar">
    <div>
      <h2>Разбор ответов</h2>
      <p class="muted">Нажмите на предмет, чтобы раскрыть задания.
        <span class="legend legend-ok">верно</span>
        <span class="legend legend-partial">частично</span>
        <span class="legend legend-wrong">неверно</span></p>
    </div>
    <label class="switch"><input type="checkbox" id="only-mistakes"><span class="switch-track"></span>
      Только ошибки</label>
  </div>
  <div class="review-list">$review</div>
</section>

<div class="hero-actions">$actions</div>
